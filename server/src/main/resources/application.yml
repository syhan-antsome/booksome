spring:
  application:
    name: booksome-api
  datasource:
    url: ${BOOKSOME_DB_URL:jdbc:mariadb://127.0.0.1:3306/booksome}
    username: ${BOOKSOME_DB_USERNAME:booksome_app}
    password: ${BOOKSOME_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${BOOKSOME_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${BOOKSOME_DB_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${BOOKSOME_DB_MIGRATOR_USERNAME:booksome_migrator}
    password: ${BOOKSOME_DB_MIGRATOR_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  threads:
    virtual:
      enabled: true
  mail:
    host: ${BOOKSOME_SMTP_HOST:localhost}
    port: ${BOOKSOME_SMTP_PORT:587}
    username: ${BOOKSOME_SMTP_USERNAME:}
    password: ${BOOKSOME_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${BOOKSOME_SMTP_AUTH:true}
          starttls:
            enable: ${BOOKSOME_SMTP_STARTTLS:true}
            required: ${BOOKSOME_SMTP_STARTTLS:true}

server:
  address: ${BOOKSOME_SERVER_ADDRESS:127.0.0.1}
  port: ${BOOKSOME_SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

booksome:
  cors:
    allowed-origins: ${BOOKSOME_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173,http://127.0.0.1:5173,https://booksome.top,https://www.booksome.top,https://admin.booksome.top}
  auth:
    jwt-secret: ${BOOKSOME_JWT_SECRET}
    issuer: ${BOOKSOME_JWT_ISSUER:https://api.booksome.top}
    audience: ${BOOKSOME_JWT_AUDIENCE:booksome-app}
    access-token-ttl: ${BOOKSOME_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${BOOKSOME_REFRESH_TOKEN_TTL:P30D}
  media:
    root-path: ${BOOKSOME_MEDIA_ROOT:/service/booksome/data/media}
    public-base-url: ${BOOKSOME_MEDIA_PUBLIC_BASE_URL:https://api.booksome.top}
  book-lookup:
    kakao-base-url: ${BOOKSOME_KAKAO_BOOK_BASE_URL:https://dapi.kakao.com}
    kakao-rest-api-key: ${BOOKSOME_KAKAO_REST_API_KEY:}
    national-library-base-url: ${BOOKSOME_NL_SEOJI_BASE_URL:https://www.nl.go.kr}
    national-library-cert-key: ${BOOKSOME_NL_SEOJI_CERT_KEY:}
  mail:
    enabled: ${BOOKSOME_MAIL_ENABLED:false}
    from-address: ${BOOKSOME_MAIL_FROM:no-reply@mail.booksome.top}
  admin:
    initial-emails: ${BOOKSOME_ADMIN_EMAILS:}
