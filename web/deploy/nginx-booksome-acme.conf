# Temporary HTTP endpoint until the HTTPS certificate and app releases exist.
# Certbot webroot: /var/www/letsencrypt
server {
    listen 80;
    listen [::]:80;
    server_name booksome.top www.booksome.top api.booksome.top admin.booksome.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name booksome.top www.booksome.top api.booksome.top admin.booksome.top;

    ssl_certificate /etc/letsencrypt/live/booksome.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booksome.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 503;
    }
}
